<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeosAI IDP 三期｜PRD与原型</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="nav-rail" id="nav"><div class="nav-brand">IP</div><div id="nav-items"></div></aside>
  <div class="shell">
    <header class="topbar">
      <div><div class="eyebrow" id="product-type">INTERACTIVE PRD</div><h1 id="product-name">Loading…</h1></div>
      <div class="actions"><button id="process-toggle" class="button" hidden style="display:none">隐藏过程产物</button><button id="edit-button" class="button">编辑 PRD</button><button id="export-button" class="button primary">下载 PRD</button></div>
    </header>
    <main>
      <div class="view-tabs"><div class="view-mode-switch" role="tablist" aria-label="工作视图"><button data-view="document" class="tab active" role="tab" aria-selected="true">文档</button><button data-view="prototype" class="tab" role="tab" aria-selected="false">文档＋原型</button><button data-view="canvas" class="tab" role="tab" aria-selected="false">全局画布</button></div><label class="prd-role-picker"><span>阅读视角</span><select id="prd-role-select" aria-label="阅读视角"><option value="all">全局</option><option value="frontend">前端</option><option value="backend">后端</option><option value="test">测试</option></select></label><span id="save-state" class="save-state">已加载</span><div id="review-tools" class="review-tools" aria-label="审阅工具"></div></div>
      <section id="document-view" class="view active"><div class="document-toolbar"><span id="document-context">先连续阅读 PRD，需要核对交互时进入同页对照。</span><button id="compare-button" class="button primary" hidden>对照原型</button></div><article id="markdown" class="markdown"></article></section>
      <section id="prototype-view" class="view">
        <div class="prototype-toolbar"><button id="exit-compare" class="button" hidden>返回文档</button><label>页面 <select id="page-select" aria-label="切换原型页面"></select></label><span id="viewport-label" class="mono"></span><button id="prototype-zoom-out" class="button" aria-label="缩小原型">−</button><span id="prototype-zoom-value" class="mono">100%</span><button id="prototype-zoom-in" class="button" aria-label="放大原型">＋</button><button id="capture-prototype-button" class="button">截图</button><a id="open-prototype-tab" class="button prototype-open-link" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开完整原型">新标签页打开 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7M21 3l-10 10M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg></a></div>
        <div id="review-layout" class="review-layout">
          <div class="prototype-column"><div id="prototype-stage" class="prototype-stage"></div></div>
          <aside id="review-inspector" class="review-inspector">
            <div class="inspector-tabs"><label class="prd-section-picker"><span class="inspector-section-title">PRD 章节切换</span><select id="prd-section-select" aria-label="切换PRD章节"></select></label><span id="inspector-module-title" hidden></span></div>
            <div id="inspector-prd" class="inspector-pane active"><article id="split-markdown" class="markdown compact"></article></div>
          </aside>
          
        </div>
      </section>
      <section id="canvas-view" class="view"><div class="canvas-toolbar"><span class="canvas-hint">全部页面<span class="canvas-instruction">拖动排列 · 点击进入文档与原型</span></span><button id="auto-layout" class="button">自动排列</button><button id="zoom-out" class="button">−</button><span id="zoom-label" class="mono">60%</span><button id="zoom-in" class="button">+</button></div><div id="canvas-scroll" class="canvas-scroll"><div id="canvas" class="canvas"></div></div></section>
    </main>
  </div>
  <dialog id="editor"><form method="dialog" class="editor-head"><strong>编辑 PRD 正文</strong><button class="icon-button" value="cancel">×</button></form><div class="editor-tools"><select id="editor-file"></select><button id="save-editor" class="button primary">保存</button></div><textarea id="editor-content" spellcheck="false"></textarea></dialog>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
