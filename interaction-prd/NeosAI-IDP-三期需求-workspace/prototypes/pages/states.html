<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../shared/tokens.css"><title>状態一覧</title></head><body><div id="app"></div><script type="module">import{mount,shell}from'../shared/components.js';mount(shell({active:'states',content:`<div class="toolbar"><h1>状態一覧</h1><span class="demo">状態サンプル</span></div><section class="panel"><h2>通常の更新完了</h2><div class="stateline"><span>変更なし <strong>28,400</strong></span><span>更新済み <strong>120</strong></span><span>確認待ち <strong>0</strong></span></div><span class="status success">更新完了</span><p>変更のない帰属関係とベクトルは再作成しません。</p></section><div class="columns"><section class="panel"><h2>一部の帰属確認待ち</h2><div class="notice warning">新規 2 件は未有効、変更 1 件は旧版を保持しています。</div><span class="status warning">管理者の確認待ち</span><p>その他の正常データは更新済みです。</p></section><section class="panel"><h2>全量データの取得が不完全</h2><div class="notice error">今回の更新は反映されていません。</div><p>現在の正式データを保持します。</p></section><section class="panel"><h2>100,000 件を超過</h2><div class="notice error">今回の操作はすべて失敗しました。</div><p>一部反映は行わず、既存データを保持します。公式分類ノードは件数に含みません。</p></section><section class="panel"><h2>全量データが 0 件</h2><div class="notice warning">確認するまで既存データを保持します。</div><button id="open-zero" class="button">今回のクリアを確認</button><p id="zero-feedback" aria-live="polite"></p></section><section class="panel"><h2>照合候補なし</h2><div class="field"><label for="manual-value">現在値</label><input id="manual-value" type="text" value="機能性不妊"></div><p>通常の項目と同じように手動修正できます。</p></section><section class="panel"><h2>処理中・待機</h2><span class="status">取得中</span><div class="skeleton"></div><div class="skeleton"></div><button class="button" disabled>処理中</button><p>同じマスタの次の更新は待機します。</p></section></div><dialog id="zero-dialog"><div class="dialog-head"><h2>今回の顧客データをクリア</h2></div><div class="dialog-body">取得結果は 0 件です。現在の顧客マスタをクリアしますか。今回のみ有効で、公式分類と過去の照合結果は保持します。</div><div class="dialog-foot"><button id="cancel-zero" class="button">キャンセル</button><button id="confirm-zero" class="button primary">OK</button></div></dialog>`}));const d=document.getElementById('zero-dialog');document.getElementById('open-zero').onclick=()=>d.showModal();document.getElementById('cancel-zero').onclick=()=>{d.close();document.getElementById('zero-feedback').textContent='キャンセルしました。既存データを保持します。';};document.getElementById('confirm-zero').onclick=()=>{d.close();document.getElementById('zero-feedback').textContent='今回のクリアを確認しました（表示サンプル）。';};</script></body></html>
