<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../shared/tokens.css"><title>コンポーネント</title></head><body><div id="app"></div><script type="module">
import {mount,shell} from '../shared/components.js';
mount(shell({content:`<div class="toolbar"><h1>コンポーネント</h1><span class="demo">画面サンプル</span></div>
<section class="panel"><div class="toolbar"><h2>マスタデータ</h2><div class="row"><button id="open-columns" class="button">列設定</button><button id="open-import" class="button primary">一括インポート</button></div></div><div class="table-wrap"><table><thead><tr><th>番号</th><th>傷病名</th><th>ICD code</th><th>分類帰属</th><th>ベクトル化状態</th></tr></thead><tbody><tr><td>1</td><td>口唇カンジダ症</td><td>B370</td><td>B37.0／カンジダ性口内炎</td><td><span class="status success">完了</span></td></tr><tr><td>2</td><td>舌カンジダ症</td><td>B370</td><td>B37.0／カンジダ性口内炎</td><td><span class="status success">完了</span></td></tr></tbody></table></div></section>
<div class="columns"><section class="panel"><h2>OCR抽出値と現在値</h2><div class="field"><label for="original">OCR原文</label><input id="original" value="機能性不妊" type="text" readonly></div><div class="field"><label for="current">現在値</label><input id="current" value="機能性不妊症" type="text"><div id="field-state" class="help" aria-live="polite">自動照合値を反映済み</div></div><details id="candidate-detail"><summary>照合候補を表示</summary><div class="candidate"><label><input type="radio" name="candidate" value="機能性不妊症" checked>機能性不妊症</label><label><input type="radio" name="candidate" value="女性不妊症">女性不妊症</label></div></details></section>
<section class="panel"><h2>マスタごとの設定</h2><div class="field"><label for="threshold">自動採用閾値</label><div class="row"><input class="inline-number" id="threshold" type="number" min="75" max="100" value="90"><span>%</span></div><p class="help">OCR照合に適用・75〜100%</p></div><button class="button primary" id="save-threshold">保存</button><p id="threshold-feedback" aria-live="polite"></p></section>
<section class="panel"><h2>QR code 処理ルール</h2><div class="field"><label for="qr-mode">取値方法</label><select id="qr-mode"><option value="full">全文</option><option value="split">分割</option></select></div><div id="qr-params" hidden><div class="field"><label for="delimiter">区切り文字</label><input id="delimiter" type="text" value="_"></div><div class="field"><label for="part">取得位置</label><input id="part" type="number" min="1" value="2"></div></div></section>
<section class="panel"><h2>OCR抽出モデル</h2><div class="field"><label for="main-model">メインモデル</label><select id="main-model"><option>gemini-3.6-flash-openai</option><option>gemini-3.7-flash-low</option></select></div><div class="field"><label for="verify-model">検証モデル</label><select id="verify-model"><option>gemini-3.7-flash-low</option><option>未設定</option></select></div><span class="muted">すべての帳票タイプに適用</span></section></div>
<dialog id="columns-dialog"><div class="dialog-head"><h2>列設定</h2><button class="button link" data-close>閉じる</button></div><div class="dialog-body"><div class="row"><input aria-label="列名：傷病名" type="text" value="傷病名"><label><input type="checkbox">照会コード</label></div><br><div class="row"><input aria-label="列名：ICD code" type="text" value="ICD code"><label><input type="checkbox" checked>照会コード</label></div></div><div class="dialog-foot"><button class="button" data-close>キャンセル</button><button class="button primary" data-close>保存</button></div></dialog>
<dialog id="import-dialog"><div class="dialog-head"><h2>一括インポート</h2><button class="button link" data-close>閉じる</button></div><div class="dialog-body"><div class="field"><label for="file">マスターファイル</label><input type="file" id="file" accept=".xlsx,.xls,.csv"></div><div class="row"><label><input type="radio" name="update" checked>追加更新</label><label><input type="radio" name="update">上書更新</label></div><p class="notice">ファイル選択のみの表示サンプルです。実データは送信しません。</p></div><div class="dialog-foot"><button class="button" data-close>キャンセル</button><button class="button primary" id="import-ok">OK</button></div></dialog>`}));
const byId=id=>document.getElementById(id);
byId('open-columns').onclick=()=>byId('columns-dialog').showModal();byId('open-import').onclick=()=>byId('import-dialog').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
byId('current').addEventListener('input',()=>byId('field-state').textContent='手動修正値を使用します');document.querySelectorAll('[name=candidate]').forEach(r=>r.onchange=()=>{byId('current').value=r.value;byId('field-state').textContent='選択した候補を反映済み';});
byId('qr-mode').onchange=e=>byId('qr-params').hidden=e.target.value!=='split';byId('save-threshold').onclick=()=>{const n=Number(byId('threshold').value);byId('threshold-feedback').textContent=byId('threshold').value!==''&&n>=75&&n<=100?'保存しました（サンプル）':'75〜100%で入力してください';};
byId('import-ok').onclick=()=>{byId('import-dialog').close();byId('threshold-feedback').textContent='表示サンプルのため、インポートは実行していません。';};
</script></body></html>
